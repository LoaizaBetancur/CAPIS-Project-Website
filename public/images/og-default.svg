<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A3F5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2A40;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#3C7887"/>
  
  <!-- Logo area -->
  <circle cx="120" cy="315" r="60" fill="none" stroke="#3C7887" stroke-width="3"/>
  <text x="120" y="325" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  
  <!-- Title -->
  <text x="240" y="260" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#FFFFFF">THE CAPIS PROJECT</text>
  
  <!-- Subtitle -->
  <text x="240" y="320" font-family="Arial, sans-serif" font-size="28" fill="#B0C4DE">Core Athletic Performance-based Intervention Set</text>
  
  <!-- Description -->
  <text x="240" y="380" font-family="Arial, sans-serif" font-size="22" fill="#B0C4DE">Developing a core outcome set for plyometric training</text>
  <text x="240" y="410" font-family="Arial, sans-serif" font-size="22" fill="#B0C4DE">in Tier 3, 4, or 5 football players</text>
  
  <!-- Registration badge -->
  <rect x="240" y="460" width="300" height="50" rx="8" fill="#3C7887"/>
  <text x="390" y="492" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">COMET Study 3589</text>
  
  <!-- Website -->
  <text x="240" y="560" font-family="Arial, sans-serif" font-size="20" fill="#B0C4DE">capis-project-website.vercel.app</text>
  
  <!-- Football icon -->
  <circle cx="1050" cy="315" r="120" fill="none" stroke="#3C7887" stroke-width="2" opacity="0.3"/>
  <circle cx="1050" cy="315" r="80" fill="none" stroke="#3C7887" stroke-width="2" opacity="0.2"/>
  
  <!-- Bottom accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#3C7887"/>
</svg>
